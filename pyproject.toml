[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lola"
version = "0.1.0"
description = "Educational Linux connector prototype for LoLa interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Open LoLa contributors" }
]
keywords = ["lola", "low-latency", "audio", "video", "interoperability", "music", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
capture = ["scapy"]
dev = ["pytest"]

[project.scripts]
open-lola = "linux_connector.lola_connector.cli:main"

[tool.setuptools.packages.find]
include = ["linux_connector*"]
exclude = ["linux_connector.process_artifacts*"]
