[project]
name = "open-lola-tools"
version = "0.1.0"
description = "Repository verification tooling for Open LoLa"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "lizard==1.24.0",
  "mypy==1.14.1",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv]
package = false
required-version = "==0.10.7"
