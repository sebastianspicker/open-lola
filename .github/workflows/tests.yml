name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pcap]"
      - name: Run tests
        run: python -m pytest linux_connector/tests
      - name: Run connector self-test
        run: python -m linux_connector.lola_connector.cli --local-ip 127.0.0.1 selftest --duration 0.25
