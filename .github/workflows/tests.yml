name: tests

on:
  push:
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"
  pull_request:
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell test dependencies
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run PowerShell quality checks
        shell: pwsh
        run: ./linux_connector/tests/powershell/Invoke-QualityChecks.ps1
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pcap]"
      - name: Run tests
        run: python -m pytest linux_connector/tests
      - name: Run connector self-test
        run: python -m linux_connector.lola_connector.cli --local-ip 127.0.0.1 selftest --duration 0.25
