name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    needs: quality
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require shared quality checks
        if: ${{ needs.quality.result != 'success' }}
        run: exit 1
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up cached Python dependencies
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install repository tooling dependencies
        run: |
          uv sync --locked --python "${{ matrix.python-version }}" --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: make python-tool-tests
      - name: Run mypy
        run: make python-mypy
    env:
      UV_PYTHON: ${{ matrix.python-version }}

  quality:
    name: Repository quality checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up cached Python dependencies
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install quality dependencies
        run: |
          uv sync --locked --python 3.13 --extra dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/open-lola-bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/open-lola-bin" actionlint
          echo "$RUNNER_TEMP/open-lola-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/open-lola-bin/actionlint" -version | head -n 1)" = "1.7.12"
      - name: Run repository code-quality gate
        run: make code-quality
      - name: Run code-quality verifier fixtures
        run: make code-quality-self-test
      - name: Lint web and workflow sources
        run: make web-lint workflow-lint
      - name: Run Ruff
        run: make python-ruff
      - name: Verify architecture boundaries and self-test fixtures
        run: make architecture
    env:
      UV_PYTHON: "3.13"

  swift:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Swift tests
        run: make swift-test SWIFT_BUILD_PATH="$RUNNER_TEMP/open-lola-swiftpm-build"
      - name: Reject Swift compiler warnings
        run: make swift-build SWIFT_BUILD_PATH="$RUNNER_TEMP/open-lola-swiftpm-build"

  rust:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust validation components
        run: rustup component add rustfmt clippy
      - name: Check Rust formatting, Clippy, and tests
        run: make test-rust
      - name: Build native Linux station
        run: cargo build --workspace --release
      - name: Run bounded bidirectional selftest
        run: cargo run -p rusty-lola --no-default-features -- selftest --duration 0.25

  windows-rust:
    name: Windows Rust validation
    runs-on: windows-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust validation components
        shell: pwsh
        run: rustup component add rustfmt clippy
      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Run Rust Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks -D clippy::missing_safety_doc
      - name: Test CLI-only build
        run: cargo test --workspace --all-targets --no-default-features
      - name: Run Rust tests
        shell: pwsh
        run: cargo test --workspace --all-targets --all-features
      - name: Build Rust release
        shell: pwsh
        run: cargo build --workspace --release
