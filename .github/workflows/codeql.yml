name: codeql

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-python:
    name: Python CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # github/codeql-action v4.38.2
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python
      # github/codeql-action v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:python"

  analyze-swift:
    name: Swift CodeQL static analysis
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # github/codeql-action v4.38.2
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: swift
          build-mode: manual
      - name: Build Swift package for CodeQL extraction
        run: >-
          swift build --disable-sandbox --scratch-path
          "$RUNNER_TEMP/open-lola-codeql-swiftpm-build"
      # github/codeql-action v4.38.2
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:swift"
