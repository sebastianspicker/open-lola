name: codeql

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-python:
    name: Python CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # github/codeql-action v4.37.6
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      # github/codeql-action v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:python"

  analyze-swift:
    name: Swift CodeQL static analysis
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # github/codeql-action v4.37.6
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build Swift package for CodeQL extraction
        run: >-
          swift build --disable-sandbox --scratch-path
          "$RUNNER_TEMP/open-lola-codeql-swiftpm-build"
      # github/codeql-action v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:swift"
