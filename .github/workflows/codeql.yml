name: codeql

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "archive/**"
      - "vendor/**"
      - "vendors/**"
      - "third_party/**"
      - "third-party/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
