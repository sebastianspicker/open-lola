name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*-alpha.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked source-alpha verification
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure temporary verification paths
        env:
          OPEN_LOLA_SWIFT_BUILD_PATH: ${{ runner.temp }}/open-lola-swiftpm-build
          UV_CACHE_DIR: ${{ runner.temp }}/open-lola-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/open-lola-uv-env
        run: |
          {
            echo "OPEN_LOLA_SWIFT_BUILD_PATH=$OPEN_LOLA_SWIFT_BUILD_PATH"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT"
          } >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native verification tools when missing
        run: |
          formulas=()
          command -v shellcheck >/dev/null 2>&1 || formulas+=(shellcheck)
          command -v node >/dev/null 2>&1 || formulas+=(node)
          command -v pwsh >/dev/null 2>&1 || formulas+=(powershell)
          if (( ${#formulas[@]} > 0 )); then
            brew update
            brew install "${formulas[@]}"
          fi
      - name: Install pinned actionlint and PSScriptAnalyzer
        run: |
          mkdir -p "$RUNNER_TEMP/open-lola-bin"
          case "$(uname -m)" in
            arm64|aarch64) actionlint_arch=arm64 ;;
            x86_64) actionlint_arch=amd64 ;;
            *) echo "unsupported actionlint architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_${actionlint_arch}.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/open-lola-bin" actionlint
          echo "$RUNNER_TEMP/open-lola-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/open-lola-bin/actionlint" -version | head -n 1 | grep -Fx '1.7.12'
          pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force'
      - name: Set up pinned Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14.6"
          enable-cache: true
      - name: Assert pinned toolchains
        run: |
          python_path="$(uv python find 3.14.6)"
          python_version="$("$python_path" --version 2>&1)"
          swift_version="$(swift --version)"
          xcode_version="$(xcodebuild -version)"
          [[ "$(uv --version)" == "uv 0.10.7"* ]]
          [[ "$python_version" == "Python 3.14.6" ]]
          grep -Fq "Apple Swift version 6.3.3" <<<"$swift_version"
          grep -Fq "Xcode 26.6" <<<"$xcode_version"
      - name: Sync Python verification tools
        run: uv sync --locked --extra dev --no-install-project
      - name: Check locked Python resolution
        run: uv lock --check
      - name: Run release-readiness verification
        env:
          OPEN_LOLA_SKIP_INTERACTIVE_APP: "1"
        run: uv run --locked --extra dev --no-sync bash tools/verify-release-readiness.sh
  python-311:
    name: Python 3.11 lower-bound verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure temporary verification paths
        env:
          MYPY_CACHE_DIR: ${{ runner.temp }}/open-lola-mypy-cache
          RUFF_CACHE_DIR: ${{ runner.temp }}/open-lola-ruff-cache
          UV_CACHE_DIR: ${{ runner.temp }}/open-lola-uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/open-lola-uv-env
        run: |
          {
            echo "MYPY_CACHE_DIR=$MYPY_CACHE_DIR"
            echo "RUFF_CACHE_DIR=$RUFF_CACHE_DIR"
            echo "UV_CACHE_DIR=$UV_CACHE_DIR"
            echo "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT"
          } >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync lower-bound Python environment
        run: uv sync --python 3.11 --locked --extra dev
      - name: Assert lower-bound Python interpreter
        run: |
          python_version="$(uv run --python 3.11 --locked --extra dev python --version)"
          [[ "$python_version" == "Python 3.11."* ]]
      - name: Check locked Python resolution
        run: uv lock --check
      - name: Run Python 3.11 verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          UV_PYTHON=3.11 make code-quality
          uv run --python 3.11 --locked --extra dev ruff check tools/verify_docs tools/lib/*.py tools/verify_source_documentation.py tools/verify_architecture.py tools/verify_code_quality.py tools/verify_pmr14_runtime_contract.py
          uv run --python 3.11 --locked --extra dev python -m mypy --strict tools/verify_docs tools/lib/*.py tools/verify_source_documentation.py tools/verify_architecture.py tools/verify_code_quality.py tools/verify_pmr14_runtime_contract.py
          UV_PYTHON=3.11 make python-tool-tests
          uv run --python 3.11 --locked --extra dev python -m tools.verify_docs
