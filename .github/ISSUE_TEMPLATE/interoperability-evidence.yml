name: Interoperability or evidence report
description: Share sanitized interoperability or measurement results.
title: "[Evidence]: "
labels:
  - interoperability
body:
  - type: markdown
    attributes:
      value: |
        Results shared here do not change the PARTIAL verdict on their own.
        Submit only public, authorized, sanitized material. Never upload private
        packet or media captures, secrets, personal data, or confidential material.
  - type: textarea
    id: claim
    attributes:
      label: Claim being tested
      description: One narrow claim that your results could prove wrong.
    validations:
      required: true
  - type: dropdown
    id: evidence-classification
    attributes:
      label: Evidence classification
      options:
        - Source inspection only
        - Synthetic fixture or unit test
        - Localhost or built-in-device run
        - Measured hardware run
        - Reference-peer run
        - Not measured
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and environment
      description: Revision, setup, what you measured, and how. Leave out identifiers and private network details.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and limits
      description: Measured values, uncertainty, failures, and what the results do not show.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments or excerpts
      description: Only sanitized, authorized files or redacted excerpts.
