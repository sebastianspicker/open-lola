name: Interoperability or evidence report
description: Share sanitized, clearly classified interoperability or measurement evidence.
title: "[Evidence]: "
labels:
  - interoperability
body:
  - type: markdown
    attributes:
      value: |
        Source-alpha evidence does not establish product PASS or field readiness.
        Submit only public, authorized, sanitized evidence. Never upload private
        packet/media captures, secrets, personal data, or confidential material.
  - type: textarea
    id: claim
    attributes:
      label: Claim under examination
      description: State one narrow, falsifiable claim without overstating readiness.
    validations:
      required: true
  - type: dropdown
    id: evidence-classification
    attributes:
      label: Evidence classification
      options:
        - Source inspection only
        - Synthetic fixture or unit test
        - Localhost or built-in-device run
        - Measured hardware run
        - Reference-peer run
        - Not measured
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Sanitized method and environment
      description: Describe revision, public setup, measurements, and controls; omit identifiers and private topology.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and limits
      description: Give measured values where available, uncertainty, failures, and what this evidence does not prove.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Public attachments or excerpts
      description: Provide only sanitized, authorized artifacts or redacted excerpts.
