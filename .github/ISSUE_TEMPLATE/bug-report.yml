name: Bug report
description: Report a bug you can reproduce, with sensitive details removed.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Open LoLa is an experimental source alpha with a PARTIAL verdict.
        Do not include credentials, private captures, personal data, hostnames,
        or confidential material. Report suspected vulnerabilities through the
        repository Security tab, not this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem without sensitive details.
      placeholder: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: evidence-classification
    attributes:
      label: Evidence classification
      description: Pick the strongest evidence you attached or reproduced.
      options:
        - Source inspection only
        - Synthetic fixture or unit test
        - Localhost or built-in-device run
        - Measured hardware run
        - Reference-peer run
        - Not measured
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands and inputs that shows the bug, with sensitive details removed.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which part of Open LoLa were you running?
      options:
        - macOS operator app (open-lola-app)
        - macOS CLI (open-lola)
        - Rust station CLI on Windows (rusty-lola)
        - Rust station CLI on Linux (rusty-lola)
        - Rust station GUI (rusty-lola ui)
        - Build or repository tooling
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Output of `git rev-parse --short HEAD` in your checkout.
      placeholder: 3da8dea
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS and version, CPU architecture, and toolchain versions
        (`swift --version`, `cargo --version`, `uv --version`, Xcode version), plus
        the audio/video devices involved. Omit hostnames and identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and reports
      description: |
        Attach redacted logs and the report JSON from the failing run.
        SUPPORT.md lists where each runtime writes them. Say what you could
        not measure.
