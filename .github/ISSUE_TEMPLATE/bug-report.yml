name: Bug report
description: Report a reproducible, sanitized source-alpha defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This project is an experimental source alpha with a PARTIAL verdict.
        Do not include credentials, private captures, personal data, hostnames,
        or confidential material. For suspected vulnerabilities, use the
        repository Security tab instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: Sanitized summary
      description: Describe the observed problem without sensitive details.
      placeholder: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: evidence-classification
    attributes:
      label: Evidence classification
      description: Choose the strongest evidence actually attached or reproduced.
      options:
        - Source inspection only
        - Synthetic fixture or unit test
        - Localhost or built-in-device run
        - Measured hardware run
        - Reference-peer run
        - Not measured
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
      description: Include minimal public commands, inputs, and results only.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which part of Open LoLa were you running?
      options:
        - macOS operator app (open-lola-app)
        - macOS CLI (open-lola)
        - Rust station CLI on Windows (rusty-lola)
        - Rust station CLI on Linux (rusty-lola)
        - Rust station GUI (rusty-lola ui)
        - Build or repository tooling
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Output of `git rev-parse --short HEAD` in your checkout.
      placeholder: 3da8dea
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS and version, CPU architecture, and toolchain versions
        (`swift --version`, `cargo --version`, `uv --version`, Xcode version), plus
        the audio/video devices involved. Omit hostnames and identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, reports, and sanitized evidence
      description: |
        Attach redacted logs and the report JSON for the failing run; SUPPORT.md
        lists where each runtime writes them. State what remains unmeasured.
