name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests clean-room and public. Do not attach proprietary material,
        private captures, secrets, personal data, or confidential requirements.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What do you need, and why? Open LoLa makes no release or field-readiness promises.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest useful code, test, or documentation change.
    validations:
      required: true
  - type: dropdown
    id: evidence-classification
    attributes:
      label: Evidence classification
      description: What kind of evidence led to this request?
      options:
        - Source inspection only
        - Synthetic fixture or unit test
        - Localhost or built-in-device run
        - Measured hardware run
        - Reference-peer run
        - Not measured
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence and limits
      description: Link public sources or summarize sanitized results. Say what is uncertain or missing.
