---
exclude_paths:
  - "archive/**"
  - "private/**"
  - "re_out/**"
  - "DerivedData/**"
  - ".build/**"
  - ".swiftpm/**"
  - ".codex/**"
  - ".codacy/**"
  - "AGENTS.md"
  - ".pytest_cache/**"
  - ".ruff_cache/**"
  - ".mypy_cache/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.pyo"
  - "third_party/opus/**"
  - "third_party/jpeg-xs/**"
  # generated lockfiles
  - "Cargo.lock"
  - "**/Cargo.lock"
  # Rust unit tests and test-only support (cfg(test))
  - "runtimes/rust-station/src/**/tests.rs"
  - "runtimes/rust-station/src/**/*_tests.rs"
  - "runtimes/rust-station/src/test_alloc.rs"
  # CI verification scripts
  - "tools/verify_*.py"
