services:
  linux-lola:
    profiles: ["host-network-lab"]
    build:
      context: ../../..
      dockerfile: linux_connector/deployment/wsl/Dockerfile
    # Lab-only: host networking is required when probing a real Windows LoLa
    # adapter path. Enable the host-network-lab profile explicitly.
    network_mode: host
    volumes:
      - ../../..:/work
    working_dir: /work
    command: ["python", "-m", "linux_connector.lola_connector.cli", "--local-ip", "127.0.0.1", "selftest"]
